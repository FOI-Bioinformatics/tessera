name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded push should not keep burning runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    # macOS is included because the project is developed on Darwin/arm64 and
    # docs/aligners.md records conda-build problems specific to that platform. Only
    # one Python version there: the point is to catch platform-specific breakage
    # (path handling, os.replace across filesystems, subprocess behaviour), not to
    # re-run the whole matrix.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install mafft aligner (Linux)
        # mafft is the default per-genome aligner and the only external binary the
        # requires_binary tests need; it ships in the ubuntu repos, so the workflow
        # stays pip-only (no conda). The aligner integration test runs in a separate
        # step below.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mafft
      - name: Install mafft aligner (macOS)
        if: runner.os == 'macOS'
        run: brew install mafft
      - name: Lint
        run: ruff check src tests validation
      - name: Type check
        # Non-blocking for now: the codebase is ~91% annotated but has never been
        # type-checked, so there is an existing backlog. It already found one real
        # defect (a None reaching lineage_of). Flip to blocking once the baseline is
        # clean, and delete this comment when you do.
        continue-on-error: true
        run: mypy
      - name: Unit and integration tests
        # The coverage floor is anchored on the pure suite (binary-gated tests run in
        # the next step). It guards the current level (about 86 percent) against erosion.
        run: pytest -q -m "not requires_binary" --cov=tessera --cov-report=term --cov-fail-under=80
      - name: Aligner integration tests (requires_binary)
        # Runs the mafft build_msa -> run_recomb end-to-end test with mafft installed
        # above. All requires_binary tests are runnable with mafft alone; heavier
        # aligners remain covered by the opt-in validation/ harnesses, not CI.
        run: pytest -q -m requires_binary

  container:
    # An image nobody builds is an image that has silently stopped building. This also
    # exercises the one path CI cannot otherwise reach: a real aligner end to end, with
    # the pinned versions the image exists to fix.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build the image
        run: docker build -t tessera:ci .
      - name: The aligners it promises are actually present
        run: |
          docker run --rm --entrypoint bash tessera:ci -lc '
            set -e
            for b in mafft minimap2 sibeliaz skani skder efetch datasets; do
              command -v "$b" > /dev/null || { echo "missing: $b"; exit 1; }
            done'
      - name: Run an analysis end to end, aligner included
        run: |
          set -e
          mkdir -p ctr/coll
          python - <<'PY'
          from pathlib import Path
          src = Path("example_data/divergent.msa.fasta").read_text().split(">")
          for block in filter(None, src):
              name, *seq = block.splitlines()
              name = name.split()[0]
              ungapped = "".join(seq).replace("-", "")
              target = Path("ctr/query.fasta") if name == "query" else Path(f"ctr/coll/{name}.fasta")
              target.write_text(f">{name}\n{ungapped}\n")
          PY
          # --user is how a Linux caller writes into a bind mount they own; the
          # README documents the same form. Running without it is the failure this
          # job caught on its first run.
          UID_GID="$(id -u):$(id -g)"
          docker run --rm --user "$UID_GID" -v "$PWD/ctr:/data" tessera:ci \
            msa --query /data/query.fasta --collection /data/coll \
                --output /data/panel.msa.fasta --aligner mafft
          docker run --rm --user "$UID_GID" -v "$PWD/ctr:/data" tessera:ci \
            recomb --msa /data/panel.msa.fasta --query query --output /data/out \
                   --window-size 300 --window-step 30
          python - <<'PY'
          import csv, json, sys
          row = next(csv.DictReader(open("ctr/out/recombination_regions.tsv"), delimiter="\t"))
          prov = json.load(open("ctr/out/run_provenance.json"))["run"]
          print(row["minor_parent"], row["major_parent"], row["msa_start"], row["msa_end"])
          print("aligner:", prov.get("aligner"))
          assert row["minor_parent"] == "parent_B", row
          # the provenance must name the aligner, which is the point of pinning it here
          assert "mafft" in (prov.get("aligner") or ""), prov
          PY

  build:
    # Packaging breaks quietly and is otherwise only discovered at release time.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Build and check the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Verify the console script runs from the built wheel
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          /tmp/venv/bin/tessera --version
          /tmp/venv/bin/tessera recomb --help > /dev/null

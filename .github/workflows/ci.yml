name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install mafft aligner
        # mafft is the default per-genome aligner and the only external binary the
        # requires_binary tests need; it ships in the ubuntu repos, so the workflow
        # stays pip-only (no conda). The aligner integration test runs in a separate
        # step below.
        run: sudo apt-get update && sudo apt-get install -y mafft
      - name: Lint
        run: ruff check src tests validation
      - name: Unit and integration tests
        # The coverage floor is anchored on the pure suite (binary-gated tests run in
        # the next step). It guards the current level (about 85 percent) against erosion.
        run: pytest -q -m "not requires_binary" --cov=tessera --cov-report=term --cov-fail-under=80
      - name: Aligner integration tests (requires_binary)
        # Runs the mafft build_msa -> run_recomb end-to-end test with mafft installed
        # above. All requires_binary tests are runnable with mafft alone; heavier
        # aligners remain covered by the opt-in validation/ harnesses, not CI.
        run: pytest -q -m requires_binary

name: Release

# Fires on a version tag. Builds the distribution, checks it, verifies the console
# script runs from the built wheel, and attaches the artifacts to the GitHub Release.
#
# Tessera is distributed through GitHub releases, not PyPI. That is a settled choice,
# not a gap: the package is only half the tool -- the aligners it shells out to are not
# pip-installable -- so `pip install tessera` would hand someone a CLI that cannot
# align, while the release artifacts and the container carry what a run actually needs.
# A release to a public index also cannot be undone, the version name being burned even
# if the file is yanked.
#
# Should that ever change: configure a trusted publisher for this repository on PyPI,
# add a `pypi` environment with whatever approvals you want, and append a job with
# `permissions: id-token: write` running `pypa/gh-action-pypi-publish`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Check the tag matches the package version
        # A tag that disagrees with the packaged version produces artifacts nobody can
        # trace back. Fail here rather than publish the mismatch.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tessera; print(tessera.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $pkg"
            exit 1
          fi
          echo "version $pkg"

      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Verify the console script runs from the built wheel
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          /tmp/venv/bin/tessera --version
          /tmp/venv/bin/tessera recomb --help > /dev/null

      - name: Attach the distribution to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera"
# Single source of truth is src/tessera/__init__.py; it was duplicated here, with
# nothing enforcing that the two agreed.
dynamic = ["version"]
description = "Tessera: identify recombination events in a query sequence against a collection of reference sequences"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jaclew" }, { name = "FOI-Bioinformatics" }]
keywords = ["bioinformatics", "recombination", "virus", "genomics", "phylogenetics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
# Upper caps to the next major: Tessera is an application (a pinned CLI, not a
# library others resolve against), so capping guards a fresh install from a
# surprise breaking major (e.g. numpy 3, biopython 2). The external aligners are
# not pip-installable, so a fully reproducible environment comes from
# environment.yml plus the aligner versions recorded in the run provenance.
dependencies = [
    "typer>=0.12,<1.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.0,<4.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "plotly>=5.18,<7.0",
    "biopython>=1.83,<2.0",
]

[project.urls]
Homepage = "https://github.com/FOI-Bioinformatics/tessera"
Repository = "https://github.com/FOI-Bioinformatics/tessera"
Issues = "https://github.com/FOI-Bioinformatics/tessera/issues"
Changelog = "https://github.com/FOI-Bioinformatics/tessera/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Capped to the next major like the runtime deps, and for the same reason: an
# unbounded dev tool means a ruff or pytest release can red CI with no code change.
dev = [
    # <10 rather than <9: pytest 8.x carries PYSEC-2026-1845, whose fix is 9.0.3.
    # A cap that blocks a security fix is worse than the surprise it guards against.
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
    "mypy>=2.3.1,<3.0",
    "pip-audit>=2.7,<3.0",
    "build>=1.2,<2.0",
    "twine>=5.1,<7.0",
]

[project.scripts]
tessera = "tessera.cli.main:app"

# In-tree aligner adapters are discovered via the same entry-point mechanism a
# third party would use, so core never imports a specific adapter directly.
[project.entry-points."tessera.aligners"]
progressivemauve = "tessera.aligners.progressivemauve:ProgressiveMauveAligner"
mafft = "tessera.aligners.mafft:MafftAligner"
minimap2 = "tessera.aligners.minimap2:Minimap2Aligner"
sibeliaz = "tessera.aligners.sibeliaz:SibeliazAligner"
cactus = "tessera.aligners.cactus:CactusAligner"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "tessera.__version__" }

[tool.setuptools.package-data]
# Ship the typing marker so the annotations are visible to consumers -- notably the
# third-party aligner adapters the entry-point group invites.
tessera = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_binary: test needs an external bioinformatics binary present on PATH",
]

[tool.coverage.run]
source = ["tessera"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
files = ["src/tessera"]
ignore_missing_imports = true
# Deliberately permissive to start: the codebase is ~91% annotated but has never been
# type-checked, so a strict configuration would report a large backlog and get
# switched off. This catches contradictions in what is already declared; tighten it
# once the baseline is clean.
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Typer declares options as call-valued argument defaults by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Subcommands are registered by importing the cmd_* modules for their side
# effects, after the Typer app is defined -- hence the late import.
"src/tessera/cli/main.py" = ["E402", "I001"]
# The HTML report embeds a compact inline stylesheet; keeping CSS rules one per
# line (rather than wrapped) is more readable than honouring the line limit.
"src/tessera/recomb/report_assets.py" = ["E501"]
